name: evidence ledger

# Keep this workflow unfiltered: branch protection requires `fresh regeneration`
# on every pull request, so the check must always report a result.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monthly, so drift is caught even when no ledger input changes.
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: fresh regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.18"
      - run: uv sync --locked --extra dev
      - name: Regenerate and compare
        run: uv run --with dynesty==3.2.0 python -m bgo_train.evidence --check
