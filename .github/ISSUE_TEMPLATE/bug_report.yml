name: Bug report
description: Something is broken, wrong, or misleading
title: "[bug]: "
labels: ["type:bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security issue, use the private advisory flow instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, permalink hash, model and dataset, browser and device.
      placeholder: |
        1. Open ...
        2. Select model M4 ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Physics / model
        - Inference / diagnostics
        - UI / scene
        - WASM / worker
        - Data / provenance
        - CI / deployment
        - Documentation
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: The hash from the "Receipts" footer, if available.
