version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:infra"]
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:web"]
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      # svelte-check 4.7.8 peers typescript ^5.0.0 || ^6.0.0, so a TS 7 bump
      # makes `npm ci` fail with ERESOLVE. Drop this rule once svelte-check
      # widens the range, and bump both together.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /train
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["type:chore", "area:infra"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type:ci", "area:infra"]
