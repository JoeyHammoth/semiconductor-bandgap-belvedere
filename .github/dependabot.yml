version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:infra"]
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["type:chore", "area:web"]
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /train
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["type:chore", "area:infra"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["type:ci", "area:infra"]
