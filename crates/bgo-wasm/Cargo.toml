[package]
name = "bgo-wasm"
description = "WebAssembly surface for the Band-Gap Observatory core."
# Inlined rather than inherited: the wasm-pack used in CI parses this file
# directly and does not resolve `workspace = true` for these fields.
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/JoeyHammoth/semiconductor-bandgap-belvedere"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
# The SIMD build emits bulk-memory instructions; wasm-opt must be told to
# accept them (design §8.3).
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-simd"]

[dependencies]
bgo-physics = { workspace = true }
wasm-bindgen = "0.2"
