[project]
name = "bgo-train"
version = "0.0.0"
description = "Offline simulator, reference posteriors and neural-posterior training for the Band-Gap Observatory"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "arviz>=0.19",
  "dynesty>=2.1",
  "numpyro>=0.15",
  "jax>=0.4.30",
]

[project.optional-dependencies]
train = ["torch>=2.4", "zuko>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgo_train"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
