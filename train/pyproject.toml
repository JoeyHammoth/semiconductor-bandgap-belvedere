[project]
name = "bgo-train"
version = "0.1.0"
description = "Offline simulator, reference posteriors and neural-posterior training for the Band-Gap Observatory"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "arviz>=0.19,<2",
  "numpyro>=0.15,<1",
  "jax>=0.4.30,<1",
]

[project.optional-dependencies]
train = ["torch>=2.4", "zuko>=0.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgo_train"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
